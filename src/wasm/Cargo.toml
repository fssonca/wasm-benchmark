[package]
name = "monte-carlo-wasm"
version = "0.1.0"
authors = ["Your Name"]
edition = "2021"

[lib]
name = "monte_carlo"
path = "monte_carlo.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }  
rand_distr = "0.4"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"  # ✅ Add this for JavaScript interop

[dependencies.web-sys]
version = "0.3"
features = ["console"]
