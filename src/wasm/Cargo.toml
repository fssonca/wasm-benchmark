[package]
name = "monte-carlo-wasm"
version = "0.1.0"
authors = ["Fernando Sousa <fssonca@gmail.com>"]
edition = "2021"
description = "Seeded Monte Carlo stock-price simulation compiled to WebAssembly"
repository = "https://github.com/fssonca/wasm-benchmark"
license = "MIT"

[lib]
name = "monte_carlo"
path = "monte_carlo.rs"
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"

[profile.release]
opt-level = 3
lto = true
